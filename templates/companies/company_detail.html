{% extends 'base.html' %}

{% block content %}
<h2>{{ company.company_name }}</h2>
<p><strong>Location:</strong> {{ company.location }}</p>
<p><strong>Website:</strong> {{ company.website }}</p>
<p>{{ company.description }}</p>
{% if company.logo %}
    <img src="{{ company.logo.url }}" alt="{{ company.company_name }} logo" width="150">
{% endif %}
<a href="{% url 'company_edit' %}">Edit Company</a>
{% endblock %}
